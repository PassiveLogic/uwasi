name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm OIDC trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.x, required for trusted publishing (npm >= 11.5.1)
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test
      - run: npm publish
