on:
  release:
    types: [published]
  # Packaging changes are the ones that can break a release, so the pack step
  # below runs on a pull request that touches them.
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish.yml
      - package.json
      - package-lock.json
      # npm reads .gitignore to decide what goes in the tarball.
      - .gitignore
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm signs the tarball with a short-lived OIDC token for provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      # `npm ci` rather than test.yml's `npm install`, so a release builds from
      # the locked dependency tree. `prepare` compiles lib/ as a side effect.
      - run: npm ci
      - run: npm test

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm does not allow a second attempt at a
      # version that is already taken.
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} declares ${tag}, package.json declares ${manifest}"
            exit 1
          fi

      # Everything the publish does, except the upload. This is what runs on a
      # pull request, on a manual run, and on a release cut in a fork — only
      # this repository owns the `uwasi` name on npm. It needs no secret.
      - name: Pack without publishing
        if: github.event_name != 'release' || github.repository != 'swiftwasm/uwasi'
        run: npm publish --dry-run

      - name: Publish
        if: github.event_name == 'release' && github.repository == 'swiftwasm/uwasi'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
